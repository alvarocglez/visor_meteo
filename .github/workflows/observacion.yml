name: Actualizar observación

on:
  schedule:
    - cron: "*/15 * * * *"   # cada hora, en el minuto 5
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests plotly

      - name: Generar observación
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python generar_observacion.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add graficas/observacion_*.html cache_observacion_*.csv
          git stash --include-untracked
          git fetch origin main
          git reset --hard origin/main
          git stash pop
          git add graficas/observacion_*.html cache_observacion_*.csv
          git commit -m "Actualizar observación" || echo "Sin cambios"
          git push
