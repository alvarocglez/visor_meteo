name: Actualizar datos

on:
  schedule:
    - cron: "0 */3 * * *"   # cada día a las 6:00 UTC
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests python-dotenv

      - name: Ejecutar script
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python actualizar_datos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cache_historico_*.csv cache_anio_actual_*.csv
          git stash --include-untracked
          git fetch origin main
          git reset --hard origin/main
          git stash pop
          git add cache_historico_*.csv cache_anio_actual_*.csv
          git commit -m "Actualización automática de datos" || echo "Sin cambios"
          git push
